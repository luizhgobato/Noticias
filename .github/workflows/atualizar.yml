name: Atualizar notícias

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT
    - cron: '0 13 * * *'   # 10:00 BRT
    - cron: '0 15 * * *'   # 12:00 BRT
    - cron: '0 17 * * *'   # 14:00 BRT
    - cron: '0 19 * * *'   # 16:00 BRT
    - cron: '0 21 * * *'   # 18:00 BRT
    - cron: '0 23 * * *'   # 20:00 BRT
    - cron: '0 1 * * *'    # 22:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install feedparser requests

      - name: Coletar notícias e gerar página
        run: python collector.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html fr.html carteira_historico.json
          git commit -m "Atualiza notícias $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sem mudanças"
          git push
